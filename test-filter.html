<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Filter Test</title>
  <style>
    body { margin: 0; padding: 20px; font-family: monospace; }
    button { margin: 5px; padding: 10px; cursor: pointer; }
    pre { background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>
  <h2>Debug Filter Function</h2>
  <div id="status"></div>
  <div id="buttons"></div>

  <h3>Console Logs:</h3>
  <pre id="logs"></pre>

  <script src="assets/js/dashboard/config.js"></script>
  <script>
    const status = document.getElementById('status');
    const buttons = document.getElementById('buttons');
    const logs = document.getElementById('logs');

    function log(msg) {
      console.log(msg);
      logs.textContent += msg + '\n';
    }

    // Open main dashboard in new window
    window.addEventListener('load', () => {
      status.innerHTML = `
        <p>1. Open browser console (F12)</p>
        <p>2. Go to cluster-dashboard.html</p>
        <p>3. In console, run: <code>filterByCluster('1')</code></p>
        <p>4. Check if layer exists: <code>map.getLayer('street-clusters')</code></p>
        <p>5. Check layer paint: <code>map.getPaintProperty('street-clusters', 'line-opacity')</code></p>
      `;

      // Test if config is loaded
      log('Config loaded: ' + (typeof MAPBOX_CONFIG !== 'undefined'));

      // Add test buttons
      for (let i = 1; i <= 6; i++) {
        const btn = document.createElement('button');
        btn.textContent = `Test Cluster ${i}`;
        btn.onclick = () => {
          log(`Cluster ${i} button clicked`);
          log('Open cluster-dashboard.html and use console to test filterByCluster("' + i + '")');
        };
        buttons.appendChild(btn);
      }
    });
  </script>
</body>
</html>
